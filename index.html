<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLSS Lookup</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    margin: 0;
    padding: 20px;
}.container { max-width: 700px; margin: auto; }

h1 { text-align: center; margin-bottom: 20px; }

textarea { width: 100%; height: 90px; border-radius: 12px; border: none; padding: 15px; font-size: 18px; box-sizing: border-box; }

.buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }

button { border: none; border-radius: 12px; padding: 14px 18px; font-size: 18px; color: white; cursor: pointer; }

.lookup { background: #2d6cdf; } .clear { background: #666; } .gps { background: #9c27b0; } .earth { background: #2e8b57; }

.result { background: #1d1d1d; border-radius: 14px; padding: 20px; margin-top: 25px; min-height: 120px; white-space: pre-wrap; font-size: 18px; line-height: 1.5; }

.note { color: #bbb; margin-top: 10px; } </style>

</head>
<body>
<div class="container">
    <h1>PLSS Lookup</h1><textarea id="coordInput" placeholder="Examples:

44.30967°N, 122.83609°W 44.30967, -122.83609 44°18'34.8"N 122°50'09.9"W"></textarea>

<div class="buttons">
    <button class="lookup" onclick="lookupPLSS()">Lookup</button>
    <button class="clear" onclick="clearInput()">Clear</button>
    <button class="gps" onclick="useGPS()">Use GPS</button>
    <button class="earth" onclick="openGoogleEarth()">Google Earth</button>
</div>

<div class="note">
    Supports decimal degrees and DMS formats.
</div>

<div class="result" id="result">

Results will appear here. </div>

</div><script>
let currentLat = null;
let currentLon = null;

function clearInput() {
    document.getElementById('coordInput').value = '';
    document.getElementById('result').innerText = 'Results will appear here.';
}

function parseCoordinates(input) {
    input = input.trim();

    // Format: 44.30967°N, 122.83609°W
    let regex1 = /([\d.]+)\s*°?\s*([NS])[,\s]+([\d.]+)\s*°?\s*([EW])/i;
    let match1 = input.match(regex1);

    if (match1) {
        let lat = parseFloat(match1[1]);
        let lon = parseFloat(match1[3]);

        if (match1[2].toUpperCase() === 'S') lat *= -1;
        if (match1[4].toUpperCase() === 'W') lon *= -1;

        return { lat, lon };
    }

    // Format: 44.30967, -122.83609
    let regex2 = /^\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*$/;
    let match2 = input.match(regex2);

    if (match2) {
        return {
            lat: parseFloat(match2[1]),
            lon: parseFloat(match2[2])
        };
    }

    // DMS format
    let regex3 = /(\d+)[°\s]+(\d+)[’'\s]+([\d.]+)["”\s]*([NS])[,\s]+(\d+)[°\s]+(\d+)[’'\s]+([\d.]+)["”\s]*([EW])/i;
    let match3 = input.match(regex3);

    if (match3) {
        let lat = dmsToDecimal(match3[1], match3[2], match3[3], match3[4]);
        let lon = dmsToDecimal(match3[5], match3[6], match3[7], match3[8]);

        return { lat, lon };
    }

    throw new Error('Could not recognize coordinate format.');
}

function dmsToDecimal(deg, min, sec, dir) {
    let val = Number(deg) + Number(min)/60 + Number(sec)/3600;

    if (dir.toUpperCase() === 'S' || dir.toUpperCase() === 'W') {
        val *= -1;
    }

    return val;
}

function approxQuarterQuarter(lat, lon, bounds) {

    const midLat =
        (bounds.ymin + bounds.ymax) / 2;

    const midLon =
        (bounds.xmin + bounds.xmax) / 2;

    let quarterNS =
        lat >= midLat ? 'N' : 'S';

    let quarterEW =
        lon >= midLon ? 'E' : 'W';

    let qqNS =
        lat >= (
            quarterNS === 'N'
                ? (midLat + bounds.ymax) / 2
                : (bounds.ymin + midLat) / 2
        ) ? 'N' : 'S';

    let qqEW =
        lon >= (
            quarterEW === 'E'
                ? (midLon + bounds.xmax) / 2
                : (bounds.xmin + midLon) / 2
        ) ? 'E' : 'W';

    return `${qqNS}${qqEW}${quarterNS}${quarterEW}`;
}

async function lookupAliquot(lat, lon) {
    try {
        const aliquotURL = 'https://gis.blm.gov/arcgis/rest/services/Cadastral/BLM_Natl_PLSS_CadNSDI/MapServer/2/query';

        const params = new URLSearchParams({
            geometry: `${lon},${lat}`,
            geometryType: 'esriGeometryPoint',
            inSR: '4326',
            spatialRel: 'esriSpatialRelIntersects',
            returnGeometry: 'true',
            outFields: '*',
            f: 'json'
        });

        const response = await fetch(`${aliquotURL}?${params}`);
        const data = await response.json();

        if (!data.features || data.features.length === 0) {
            return null;
        }

        const attrs = data.features[0].attributes;

        const possibleFields = [
            'QQSEC',
            'QSEC',
            'LABEL',
            'ALIQUOT',
            'LEGALDESC'
        ];

        for (const field of possibleFields) {
            if (attrs[field]) {
                return attrs[field];
            }
        }

        return null;

    } catch (err) {
        console.log(err);
        return null;
    }
}

async function lookupPLSS() {
    const input = document.getElementById('coordInput').value;
    const result = document.getElementById('result');

    try {
        const coords = parseCoordinates(input);

        currentLat = coords.lat;
        currentLon = coords.lon;

        result.innerText = 'Looking up PLSS data...';

        const url = 'https://gis.blm.gov/arcgis/rest/services/Cadastral/BLM_Natl_PLSS_CadNSDI/MapServer/1/query';

        const params = new URLSearchParams({
            geometry: `${coords.lon},${coords.lat}`,
            geometryType: 'esriGeometryPoint',
            inSR: '4326',
            spatialRel: 'esriSpatialRelIntersects',
            returnGeometry: 'true',
            outFields: '*',
            f: 'json'
        });

        const response = await fetch(`${url}?${params}`);
        const data = await response.json();

        if (!data.features || data.features.length === 0) {
            result.innerText = 'No PLSS data found.';
            return;
        }

        const attrs = data.features[0].attributes;

        // Try multiple possible field names from BLM datasets
        const township =
    attrs.TWNSHPNO
        ? attrs.TWNSHPNO + attrs.TWNSHPDIR
        : 'Unknown';

        const range =
    attrs.RANGENO
        ? attrs.RANGENO + attrs.RANGEDIR
        : 'Unknown';

        let section = 'Unknown';

try {

    const sectionURL =
        'https://gis.blm.gov/arcgis/rest/services/Cadastral/BLM_Natl_PLSS_CadNSDI/MapServer/2/query';

    const sectionParams = new URLSearchParams({
        geometry: `${coords.lon},${coords.lat}`,
        geometryType: 'esriGeometryPoint',
        inSR: '4326',
        spatialRel: 'esriSpatialRelIntersects',
        returnGeometry: 'false',
        outFields: '*',
        f: 'json'
    });

    const sectionResponse =
        await fetch(`${sectionURL}?${sectionParams}`);

    const sectionData =
        await sectionResponse.json();
    window.sectionData = sectionData;

    if (sectionData.features &&
        sectionData.features.length > 0) {

        const secAttrs =
            sectionData.features[0].attributes;
      
        result.innerText = JSON.stringify(secAttrs, null, 2);
return; 

        section =
            secAttrs.FRSTDIVNO ||
            secAttrs.SECDIVNO ||
            secAttrs.SEC ||
            secAttrs.SEC_NO ||
            secAttrs.SECTION ||
            'Unknown';
    }

} catch (e) {
    console.log('Section lookup failed', e);
}

        let aliquot = await lookupAliquot(coords.lat, coords.lon);

        if (!aliquot) {

    const geom = window.sectionData.features[0].geometry;

    let xmin = Infinity;
    let xmax = -Infinity;
    let ymin = Infinity;
    let ymax = -Infinity;

    const rings = geom.rings || [];

    for (const ring of rings) {
        for (const pt of ring) {

            const x = pt[0];
            const y = pt[1];

            if (x < xmin) xmin = x;
            if (x > xmax) xmax = x;
            if (y < ymin) ymin = y;
            if (y > ymax) ymax = y;
        }
    }

    aliquot =
        approxQuarterQuarter(
            coords.lat,
            coords.lon,
            {
                xmin,
                xmax,
                ymin,
                ymax
            }
        ) + ' (Approx.)';
}
        result.innerText =
`Latitude: ${coords.lat}
Longitude: ${coords.lon}

Township: ${township}
Range: ${range}
Section: ${section}
Quarter-Quarter: ${aliquot}

Legal Description:
T${township} R${range} Sec ${section} ${aliquot}`;

    } catch (err) {
        result.innerText = `Error: ${err.message}`;
    }
}

function openGoogleEarth() {
    if (currentLat === null || currentLon === null) {
        alert('Run a lookup first.');
        return;
    }

    const url = `https://earth.google.com/web/search/${currentLat},${currentLon}`;
    window.open(url, '_blank');
}

function useGPS() {
    const result = document.getElementById('result');

    if (!navigator.geolocation) {
        result.innerText = 'Geolocation not supported.';
        return;
    }

    result.innerText = 'Getting GPS location...';

    navigator.geolocation.getCurrentPosition(
        function(position) {
            const lat = position.coords.latitude.toFixed(6);
            const lon = position.coords.longitude.toFixed(6);

            document.getElementById('coordInput').value = `${lat}, ${lon}`;
            lookupPLSS();
        },
        function(error) {
            result.innerText = 'GPS error: ' + error.message;
        }
    );
}
</script></body>
</html>
