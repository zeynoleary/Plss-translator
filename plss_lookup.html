<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PLSS Lookup</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #121212;
        color: #f0f0f0;
        margin: 0;
        padding: 20px;
    }.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

textarea {
    width: 100%;
    height: 80px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    resize: vertical;
    box-sizing: border-box;
}

.button-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
}

button {
    background: #2e7dff;
    color: white;
    border: none;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.clear-btn {
    background: #666;
}

.earth-btn {
    background: #2e8b57;
}

.gps-btn {
    background: #9c27b0;
}

.result {
    margin-top: 20px;
    background: #1e1e1e;
    padding: 16px;
    border-radius: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
}

.small {
    font-size: 13px;
    color: #bdbdbd;
    margin-top: 8px;
}

</style>
</head>
<body>
<div class="container">
    <h1>PLSS Lookup</h1><textarea id="coordInput" placeholder="Paste coordinates here...

Examples: 44.30967°N, 122.83609°W 44.30967, -122.83609 44°18'34.8"N 122°50'09.9"W 44 18 34.8 N, 122 50 09.9 W"></textarea>

<div class="button-row">
    <button onclick="lookupPLSS()">Lookup</button>
    <button class="clear-btn" onclick="clearInput()">Clear</button>
    <button class="gps-btn" onclick="useGPS()">Use GPS</button>
    <button class="earth-btn" onclick="openGoogleEarth()">Google Earth</button>
</div>

<div class="small">
    Supports Decimal Degrees, Signed Decimal, and DMS formats.
</div>

<div class="result" id="result">

Results will appear here. </div>

</div><script>
let currentLat = null;
let currentLon = null;

function clearInput() {
    document.getElementById('coordInput').value = '';
    document.getElementById('result').innerText = 'Results will appear here.';
}

function parseCoordinates(input) {
    input = input.trim();

    // ---------------------------------
    // Format 1:
    // 44.30967°N, 122.83609°W
    // ---------------------------------
    let regex1 = /([\d.]+)\s*°?\s*([NS])[,\s]+([\d.]+)\s*°?\s*([EW])/i;
    let match1 = input.match(regex1);

    if (match1) {
        let lat = parseFloat(match1[1]);
        let lon = parseFloat(match1[3]);

        if (match1[2].toUpperCase() === 'S') lat *= -1;
        if (match1[4].toUpperCase() === 'W') lon *= -1;

        return { lat, lon };
    }

    // ---------------------------------
    // Format 2:
    // 44.30967, -122.83609
    // ---------------------------------
    let regex2 = /^\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*$/;
    let match2 = input.match(regex2);

    if (match2) {
        return {
            lat: parseFloat(match2[1]),
            lon: parseFloat(match2[2])
        };
    }

    // ---------------------------------
    // Format 3:
    // 44°18'34.8"N 122°50'09.9"W
    // ---------------------------------
    let regex3 = /(\d+)[°\s]+(\d+)[’'\s]+([\d.]+)["”\s]*([NS])[,\s]+(\d+)[°\s]+(\d+)[’'\s]+([\d.]+)["”\s]*([EW])/i;
    let match3 = input.match(regex3);

    if (match3) {
        let lat = dmsToDecimal(match3[1], match3[2], match3[3], match3[4]);
        let lon = dmsToDecimal(match3[5], match3[6], match3[7], match3[8]);

        return { lat, lon };
    }

    throw new Error('Could not recognize coordinate format.');
}

function dmsToDecimal(deg, min, sec, dir) {
    let val = Number(deg) + Number(min)/60 + Number(sec)/3600;

    if (dir.toUpperCase() === 'S' || dir.toUpperCase() === 'W') {
        val *= -1;
    }

    return val;
}

function quarterQuarter(lat, lon) {
    let ns = (Math.abs(lat * 1000) % 1000) > 500 ? 'N' : 'S';
    let ew = (Math.abs(lon * 1000) % 1000) > 500 ? 'E' : 'W';

    let ns2 = (Math.abs(lat * 2000) % 1000) > 500 ? 'N' : 'S';
    let ew2 = (Math.abs(lon * 2000) % 1000) > 500 ? 'E' : 'W';

    return `${ns}${ew}-${ns2}${ew2}`;
}

async function lookupPLSS() {
    const input = document.getElementById('coordInput').value;
    const result = document.getElementById('result');

    try {
        const coords = parseCoordinates(input);

        currentLat = coords.lat;
        currentLon = coords.lon;

        result.innerText = 'Looking up PLSS data...';

        // Primary PLSS lookup
        const url = 'https://gis.blm.gov/arcgis/rest/services/Cadastral/BLM_Natl_PLSS_CadNSDI/MapServer/1/query';

        const params = new URLSearchParams({
            geometry: `${coords.lon},${coords.lat}`,
            geometryType: 'esriGeometryPoint',
            inSR: '4326',
            spatialRel: 'esriSpatialRelIntersects',
            returnGeometry: 'false',
            outFields: '*',
            f: 'json'
        });

        const response = await fetch(`${url}?${params}`);
        const data = await response.json();

        if (!data.features || data.features.length === 0) {
            result.innerText = 'No PLSS data found for this location.';
            return;
        }

        const attrs = data.features[0].attributes;

        const township = attrs.TOWNSHIP || 'Unknown';
        const range = attrs.RANGE || 'Unknown';
        const section = attrs.FRSTDIVNO || 'Unknown';

        // Attempt REAL aliquot lookup
        let aliquot = null;

        try {
            aliquot = await lookupAliquot(coords.lat, coords.lon);
        } catch (e) {
            console.log('Aliquot lookup failed:', e);
        }

        // Fallback to approximation if GIS subdivision unavailable
        if (!aliquot) {
            aliquot = quarterQuarter(coords.lat, coords.lon) + ' (Approx.)';
        }

        result.innerText =
`Latitude: ${coords.lat}
Longitude: ${coords.lon}

Township: ${township}
Range: ${range}
Section: ${section}
Quarter-Quarter: ${aliquot}

Legal Description:
T${township} R${range} Sec ${section} ${aliquot}`;

    } catch (err) {
        result.innerText = `Error: ${err.message}`;
    }
}

    } catch (err) {
        result.innerText = `Error: ${err.message}`;
    }
}

// --------------------------------------------------
// Attempt real aliquot subdivision lookup
// --------------------------------------------------
async function lookupAliquot(lat, lon) {

    // Different states expose subdivision layers differently.
    // This layer works for many western PLSS states.

    const aliquotURL = 'https://gis.blm.gov/arcgis/rest/services/Cadastral/BLM_Natl_PLSS_CadNSDI/MapServer/2/query';

    const params = new URLSearchParams({
        geometry: `${lon},${lat}`,
        geometryType: 'esriGeometryPoint',
        inSR: '4326',
        spatialRel: 'esriSpatialRelIntersects',
        returnGeometry: 'false',
        outFields: '*',
        f: 'json'
    });

    const response = await fetch(`${aliquotURL}?${params}`);
    const data = await response.json();

    if (!data.features || data.features.length === 0) {
        return null;
    }

    const attrs = data.features[0].attributes;

    // Common possible aliquot field names
    const possibleFields = [
        'QQSEC',
        'QSEC',
        'FRSTDIVID',
        'LABEL',
        'LEGALDESC',
        'ALIQUOT'
    ];

    for (const field of possibleFields) {
        if (attrs[field]) {
            return attrs[field];
        }
    }

    return null;
}

function openGoogleEarth() {
    if (currentLat === null || currentLon === null) {
        alert('Run a lookup first.');
        return;
    }

    const url = `https://earth.google.com/web/search/${currentLat},${currentLon}`;
    window.open(url, '_blank');
}

function useGPS() {
    const result = document.getElementById('result');

    if (!navigator.geolocation) {
        result.innerText = 'Geolocation is not supported on this device.';
        return;
    }

    result.innerText = 'Getting GPS location...';

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude.toFixed(6);
            const lon = position.coords.longitude.toFixed(6);

            document.getElementById('coordInput').value = `${lat}, ${lon}`;
            lookupPLSS();
        },
        (error) => {
            result.innerText = 'GPS error: ' + error.message;
        }
    );
}
</script></body>
</html>
